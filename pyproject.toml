[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-crew"
version = "1.0.0"
description = "Production-ready multi-agent content pipeline with CrewAI (research → write → social)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Content Crew Contributors" }]
keywords = ["crewai", "multi-agent", "llm", "content-generation", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "crewai==0.80.0",
  "crewai-tools==0.38.0",
  "langchain==0.3.20",
  "langchain-community==0.3.19",
  "python-dotenv==1.0.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "pyyaml==6.0.2",
  "rich==13.9.4",
  "typer==0.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.2",
  "mypy==1.14.1",
  "types-PyYAML==6.0.12.20241230",
]

[project.scripts]
content-crew = "content_crew.cli:app"

[project.urls]
Homepage = "https://github.com/example/Multi-Agents-on-CrewAI"
Documentation = "https://github.com/example/Multi-Agents-on-CrewAI#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["content_crew"]
